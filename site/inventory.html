<body data-page="inventory">
<main id="main">
<section class="page-hero page-hero--img"><img src="assets/img/hero-1-showroom.jpg" alt="" data-kenburns><div class="wrap reveal">
<span class="eyebrow">In the lot now</span><h1 class="h2"><span class="l1">All</span><span class="l2">Inventory</span></h1><div class="count-pill"><b id="inv-total">0</b> vehicles in stock</div></div><span class="scroll-dot" aria-hidden="true"></span></section>
<section class="inv sec--alt"><div class="wrap inv-layout">
 <aside class="filter-side" id="filter-side" aria-label="Filters">
  <form>
   <div class="fx-head"><b>Filters</b><button type="button" class="fx-clear" data-clear>Clear all</button><button type="button" class="fx-x" data-close-filters aria-label="Close filters">×</button></div>
   <label class="fx-search"><span class="sr-only">Search</span><input id="fx-q" type="search" placeholder="Search model, e.g. G63, CSL, Raptor"></label>
   <div class="fx-presets"><button type="button" data-preset="supercars">Supercars</button><button type="button" data-preset="suv">SUVs</button><button type="button" data-preset="under1m">Under R1m</button><button type="button" data-preset="low-km">Low km</button><button type="button" data-preset="v8">V8</button><button type="button" data-preset="bakkie">Bakkies</button></div>
   <details class="fx-group" open><summary>Make</summary><div class="fx-body"><div id="fx-make" class="fx-list"></div></div></details><details class="fx-group" open><summary>Body type</summary><div class="fx-body"><div id="fx-body" class="fx-pills"></div></div></details><details class="fx-group" open><summary>Price</summary><div class="fx-body"><div class="fx-range"><output id="o-price"></output><label><span class="sr-only">Minimum price</span><input type="range" id="fx-pmin"></label><label><span class="sr-only">Maximum price</span><input type="range" id="fx-pmax"></label></div></div></details><details class="fx-group" open><summary>Year</summary><div class="fx-body"><div class="fx-two"><label><span class="sr-only">Year from</span><select id="fx-ymin"></select></label><label><span class="sr-only">Year to</span><select id="fx-ymax"></select></label></div></div></details><details class="fx-group" open><summary>Mileage</summary><div class="fx-body"><div class="fx-range"><output id="o-km"></output><label><span class="sr-only">Maximum mileage</span><input type="range" id="fx-km" min="0"></label></div></div></details><details class="fx-group" ><summary>Fuel</summary><div class="fx-body"><div id="fx-fuel" class="fx-list"></div></div></details><details class="fx-group" ><summary>Gearbox</summary><div class="fx-body"><div id="fx-trans" class="fx-list"></div></div></details><details class="fx-group" ><summary>Engine</summary><div class="fx-body"><div id="fx-engine" class="fx-list"></div></div></details>
   <button type="button" class="btn btn--solid btn--block fx-done" data-close-filters>Show <span id="fx-open-count">0</span> cars</button>
  </form>
 </aside>
 <div class="inv-main">
  <div class="inv-bar"><button type="button" class="btn fx-open" id="fx-open" aria-expanded="false" aria-controls="filter-side">Filters</button>
   <span class="tiny" id="inv-count" aria-live="polite"></span>
   <label class="inv-sort"><span class="tiny">Sort</span><select id="fx-sort"><option value="newest">Newest arrivals</option><option value="price-desc">Price: high to low</option><option value="price-asc">Price: low to high</option><option value="km-asc">Lowest mileage</option><option value="year-desc">Newest model year</option><option value="kw-desc">Most powerful</option></select></label></div>
  <div class="active-chips" id="active-chips"></div>
  <div class="grid-cards" id="inv-grid"></div>

 </div>
